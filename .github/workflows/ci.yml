name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libreoffice-impress poppler-utils fontconfig fonts-dejavu
      # doc2speech is a sibling package and is not on a package index yet, so
      # it is installed on its own first. Set the repository variable
      # DOC2SPEECH_SOURCE to a pip requirement, for example a git URL, until
      # a released version can be resolved by name.
      - run: pip install "${DOC2SPEECH_SOURCE:-doc2speech}"
        env:
          DOC2SPEECH_SOURCE: ${{ vars.DOC2SPEECH_SOURCE }}
      - run: pip install -e ".[test]"
      - run: pytest -q
