name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libreoffice-impress poppler-utils fontconfig fonts-dejavu
      # doc2speech is a sibling package and is pulled from its repository by pip,
      # so it needs no step of its own.
      - run: pip install -e ".[test]"
      - run: pytest -q
